<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="40%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.2" />
    </linearGradient>

    <!-- 3D Gold Coin Gradients -->
    <radialGradient id="coinFace" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="55%" stop-color="#EAB308" />
      <stop offset="85%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </radialGradient>

    <linearGradient id="coinRim3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="30%" stop-color="#EAB308" />
      <stop offset="70%" stop-color="#713F12" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <linearGradient id="coinDepth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A16207" />
      <stop offset="50%" stop-color="#713F12" />
      <stop offset="100%" stop-color="#3A1D05" />
    </linearGradient>

    <radialGradient id="neonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#EAB308" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="drop3D" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.7" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4F46E5" flood-opacity="0.4" />
    </filter>

    <filter id="coinShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#CA8A04" flood-opacity="0.5" />
    </filter>

    <filter id="glowSparkle">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="230" fill="url(#neonGlow)" />
  <circle cx="256" cy="240" r="180" fill="url(#goldGlow)" />

  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#drop3D)" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#rimGrad)" stroke-width="4.5" />

  <g transform="translate(0, -6)" filter="url(#coinShadow)">
    <path d="M 120 256 C 120 330, 180 390, 256 390 C 332 390, 392 330, 392 256 L 392 284 C 392 358, 332 418, 256 418 C 180 418, 120 358, 120 284 Z" fill="url(#coinDepth)" />
    <circle cx="256" cy="256" r="136" fill="url(#coinRim3D)" />
    <circle cx="256" cy="256" r="133" fill="none" stroke="#713F12" stroke-width="3" stroke-dasharray="6,4" opacity="0.5" />
    <circle cx="256" cy="252" r="124" fill="url(#coinFace)" />
    <circle cx="256" cy="252" r="110" fill="none" stroke="#CA8A04" stroke-width="3.5" opacity="0.8" />
    
    <g transform="translate(256, 246) scale(1.15)" text-anchor="middle" dominant-baseline="central">
      <text x="2" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="110" fill="#713F12" opacity="0.7">₹</text>
      <text x="-1.5" y="-1.5" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="110" fill="#FEF08A">₹</text>
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="110" fill="#451A03">₹</text>
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="108" fill="url(#coinRim3D)">₹</text>
    </g>

    <polygon points="320,190 326,204 340,210 326,216 320,230 314,216 300,210 314,204" fill="#FFFFFF" opacity="0.95" filter="url(#glowSparkle)" />
    <path d="M 160 190 Q 256 140 352 190 Q 256 170 160 190 Z" fill="#FFFFFF" opacity="0.45" />
  </g>

  <g transform="translate(382, 110) scale(0.9)" filter="url(#drop3D)">
    <polygon points="25,0 50,22 25,50 0,22" fill="#10B981" />
    <polygon points="25,0 50,22 25,26" fill="#34D399" />
    <polygon points="0,22 25,0 25,26" fill="#6EE7B7" />
    <polygon points="25,26 50,22 25,50" fill="#059669" />
    <polygon points="0,22 25,26 25,50" fill="#047857" />
  </g>
</svg>
